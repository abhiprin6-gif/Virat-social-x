<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login | VIRAT SOCIAL X</title>
<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,sans-serif;
background:#0f172a;
color:#fff;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
}
.box{
width:100%;
max-width:420px;
background:#1e293b;
padding:28px;
border-radius:25px;
box-shadow:0 10px 35px #0006;
}
.logo{
width:65px;height:65px;
border-radius:50%;
background:#2563eb;
display:flex;
align-items:center;
justify-content:center;
font-size:35px;
font-weight:bold;
margin:auto;
}
h1{text-align:center}
input{
width:100%;
padding:15px;
margin:7px 0;
border:0;
border-radius:14px;
font-size:16px;
}
button{
width:100%;
padding:15px;
border:0;
border-radius:14px;
background:#2563eb;
color:#fff;
font-size:16px;
font-weight:bold;
margin-top:10px;
}
a{
display:block;
text-align:center;
color:#93c5fd;
margin-top:18px;
text-decoration:none;
}
#msg{
text-align:center;
min-height:20px;
margin-top:12px;
}
</style>

<style id="vx-global-system">
html{scroll-behavior:smooth}

#vx-loader{
position:fixed;
inset:0;
z-index:2147483647;
display:flex;
align-items:center;
justify-content:center;
background:#0f172a;
color:#fff;
font-family:Arial,sans-serif;
font-size:18px;
font-weight:bold;
transition:opacity .25s ease;
}

#vx-loader.hide{
opacity:0;
visibility:hidden;
pointer-events:none;
}

#vx-top{
position:fixed;
right:15px;
bottom:75px;
z-index:99998;
width:45px;
height:45px;
border:0;
border-radius:50%;
background:#2563eb;
color:#fff;
font-size:20px;
display:none;
}

#vx-theme{
position:fixed;
right:15px;
bottom:130px;
z-index:99998;
border:0;
border-radius:50%;
width:43px;
height:43px;
background:#1e293b;
color:#fff;
}

#vx-bottom{
position:fixed;
left:0;
right:0;
bottom:0;
z-index:99997;
display:flex;
justify-content:space-around;
padding:7px 5px;
background:#0f172a;
}

#vx-bottom a{
flex:1;
max-width:100px;
text-align:center;
color:#fff;
text-decoration:none;
font-size:11px;
padding:6px 2px;
}

#vx-bottom span{
display:block;
font-size:20px;
}

.vx-online{
position:fixed;
left:12px;
bottom:15px;
z-index:99996;
color:#fff;
background:#166534;
border-radius:20px;
padding:7px 11px;
font-size:11px;
}

body{
padding-bottom:65px!important;
}

@media(min-width:800px){
#vx-bottom{display:none}
body{padding-bottom:0!important}
}
</style>

</head>
<body>

<div class="box">
<div class="logo">V</div>
<h1>Welcome Back</h1>

<form id="loginForm">
<input id="email" type="email" placeholder="Email" required>
<input id="password" type="password" placeholder="Password" required>
<button type="submit">Login</button>
</form>

<div id="msg"></div>

<a href="signup.html">Create New Account</a>
<a href="index.html">Continue as Guest</a>
</div>

<script src="Js/auth.js"></script>
<script>
document.getElementById("loginForm").onsubmit=function(e){
e.preventDefault();

const ok=VXAuth.login(
document.getElementById("email").value,
document.getElementById("password").value
);

const msg=document.getElementById("msg");

if(ok){
msg.textContent="✅ Login successful";
setTimeout(()=>location.href="profile.html",500);
}else{
msg.textContent="❌ Email या password गलत है";
}
};
</script>

<script id="vx-global-system-js">
(function(){

function removeLoader(){
 const loader=document.getElementById("vx-loader");
 if(loader){
   loader.classList.add("hide");
   setTimeout(function(){
     if(loader.parentNode) loader.parentNode.removeChild(loader);
   },400);
 }
}

if(document.readyState==="loading"){
 document.addEventListener("DOMContentLoaded",removeLoader);
}else{
 removeLoader();
}

window.addEventListener("load",removeLoader);

setTimeout(removeLoader,1000);

const top=document.getElementById("vx-top");

window.addEventListener("scroll",function(){
 if(top) top.style.display=window.scrollY>300?"block":"none";
});

if(top){
 top.onclick=function(){
  window.scrollTo({top:0,behavior:"smooth"});
 };
}

if("serviceWorker" in navigator){
 navigator.serviceWorker.register(
   location.pathname.includes("/pages/")
   ? "../sw.js"
   : "./sw.js"
 ).catch(function(){});
}

})();
</script>

</body>
</html>
