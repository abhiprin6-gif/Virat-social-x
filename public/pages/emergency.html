<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Emergency Help</title>
<link rel="stylesheet" href="../Css/style.css">
</head>
<body>
<header>
<div class="logo">V</div>
<div class="title"><h1>VIRAT SOCIAL <span class="s">X</span></h1><small>EMERGENCY HELP</small></div>
</header>
<main class="layout">
<section class="hero"><div class="heroBox">
<h2>🆘 Emergency Help</h2>
<p>आपातकाल में तुरंत सहायता पाने के लिए उपयोगी विकल्प।</p>
</div></section>
<section class="grid">
<div class="help"><div class="helpIcon">📞</div><h3>112</h3><p>भारत का integrated emergency number</p><button class="btn" onclick="location.href='tel:112'">Call 112</button></div>
<div class="help"><div class="helpIcon">🚑</div><h3>108</h3><p>Ambulance emergency service</p><button class="btn" onclick="location.href='tel:108'">Call 108</button></div>
<div class="help"><div class="helpIcon">🔥</div><h3>101</h3><p>Fire emergency</p><button class="btn" onclick="location.href='tel:101'">Call 101</button></div>
<div class="help"><div class="helpIcon">👮</div><h3>Police</h3><p>आपातकालीन पुलिस सहायता</p><button class="btn" onclick="location.href='tel:112'">Call</button></div>
</section>
</main>
</body>
</html>
