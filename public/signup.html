<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Signup - VIRAT SOCIAL X</title>
<link rel="stylesheet" href="Css/style.css">
</head>
<body>
<div class="card" style="max-width:420px;margin:80px auto">
<h1>⚡ VIRAT SOCIAL X</h1>
<h2 style="margin:20px 0">Create Account</h2>
<input id="name" placeholder="Full Name" style="width:100%;padding:14px;margin:8px 0">
<input id="email" placeholder="Email" style="width:100%;padding:14px;margin:8px 0">
<input id="password" type="password" placeholder="Password" style="width:100%;padding:14px;margin:8px 0">
<button onclick="signup()">Sign Up</button>
<p style="margin-top:20px">Already registered? <a href="login.html">Login</a></p>
</div>
<script>
function signup(){
if(!name.value||!email.value||!password.value)return alert("Sabhi details bharo");
localStorage.setItem("viratUser",name.value);
alert("Account created!");
location.href="login.html";
}
</script>
</body>
</html>
