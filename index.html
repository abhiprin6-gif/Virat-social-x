OCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#07111f">

    <title>VIRAT X - Future Search</title>

    <!-- Main CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Browser 6CSS -->
    <link rel="stylesheet" href="browser.css">

    <!-- Unique CSS -->
    <link rel="stylesheet" href="Css/unique.css">
</head>

<body>

<header class="topbar">

    <button id="menuBtn">☰</button>

    <div class="logo">
        <b>V</b>

        <span>
            VIRAT X
            <small>Future Search</small>
        </span>
    </div>

    <button id="themeBtn">◐</button>

</header>


<aside id="sidebar" class="sidebar">

    <h2>VIRAT X</h2>

    <a href="#">⌂ Home</a>
    <a href="#">⌕ Search</a>
    <a href="#">▣ Images</a>
    <a href="#">▶ Videos</a>
    <a href="#">📰 News</a>
    <a href="#">☆ Bookmarks</a>
    <a href="#">◷ History</a>

</aside>


<main class="main-content">

    <section class="hero">

        <div class="big-logo">V</div>

        <h1>VIRAT <span>X</span></h1>

        <p>Search beyond today.</p>


        <div class="search-box">

            <span>⌕</span>

            <input
                id="searchInput"
                type="search"
                placeholder="Search anything..."
            >

            <button id="voiceBtn">🎙️</button>

            <button id="searchBtn">
                Search
            </button>

        </div>


        <div class="links">

            <button>🌐 Web</button>

            <button>🖼️ Images</button>

            <button>🎬 Videos</button>

            <button>📰 News</button>

            <button>🤖 AI</button>

        </div>

    </section>


    <section id="results">

        <div class="card">

            <div>✦</div>

            <h2>Welcome to VIRAT X</h2>

            <p>
                A new generation search experience
                built for the future.
            </p>

        </div>

    </section>

</main>


<footer>

    VIRAT X © 2026

</footer>


<!-- JavaScript -->

<script src="Js/Search.js"></script>
<script src="Js/Voice.js"></script>
<script src="Js/App.js"></script>
<script src="Js/Script.js"></script>
<script src="Js/History.js"></script>

</body>
</html>
