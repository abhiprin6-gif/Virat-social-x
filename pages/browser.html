<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VIRAT Browser</title>
<link rel="stylesheet" href="../Css/style.css">
</head>
<body>
<div id="vxHelpBar">
<a href="../index.html" class="vxHelpBtn">🆘 Help</a>
<button class="vxHelpBtn" onclick="navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>window.open('https://www.google.com/maps/search/hospital/@'+p.coords.latitude+','+p.coords.longitude+',14z','_blank')):alert('Location उपलब्ध नहीं है')">📍 Location</button>
</div>
<style>
#vxHelpBar{
display:flex;
gap:12px;
padding:12px 16px;
margin:0 auto 18px;
width:min(1200px,94%);
position:relative;
z-index:10;
}
.vxHelpBtn{
flex:1;
max-width:180px;
padding:12px 16px;
border:0;
border-radius:15px;
background:#2563eb;
color:white;
font-weight:bold;
font-size:15px;
text-align:center;
text-decoration:none;
cursor:pointer;
}
</style>


<style>
#vxNavBar{
position:sticky;
top:0;
z-index:9990;
display:flex;
gap:10px;
padding:10px;
background:#111827;
box-shadow:0 3px 12px #0003;
}
#vxNavBar button,#vxNavBar a{
border:0;
padding:10px 15px;
border-radius:12px;
background:#1f2937;
color:#fff;
text-decoration:none;
font-size:15px;
cursor:pointer;
}
#vxNavBar a{margin-left:auto}
@media(max-width:600px){
#vxNavBar button,#vxNavBar a{
padding:9px 11px;
font-size:14px;
}
}
</style>

<header>
<div class="logo">V</div>
<div class="title"><h1>VIRAT BROWSER</h1><small>FAST • SIMPLE • FUTURE</small></div>
</header>

<main class="layout">
<section class="card" style="text-align:center">
<h2>🌐 VIRAT Browser</h2>
<p style="margin:15px 0">Web search करें</p>

<input id="url" class="search"
style="width:90%;max-width:700px"
placeholder="Search or enter website">

<button class="btn" onclick="go()">Go</button>
</section>
</main>

<script>
function go(){
let q=document.getElementById("url").value.trim();
if(!q)return;

if(/^https?:\/\//i.test(q)){
location.href=q;
}else{
location.href="https://www.google.com/search?q="+encodeURIComponent(q);
}
}
</script>

<style>
#vxMenu{display:none!important;position:fixed;top:15px;left:15px;z-index:99999;width:52px;height:52px;border:0;border-radius:50%;font-size:25px;background:#fff;box-shadow:0 4px 15px #0004;cursor:pointer}
#vxSide{position:fixed;top:0;left:-300px;width:280px;height:100vh;z-index:99998;background:#111827;padding:85px 15px 20px;box-sizing:border-box;transition:.3s;overflow:auto}
#vxSide.open{left:0}
#vxSide a{display:block;padding:14px;margin:7px 0;border-radius:13px;background:#1f2937;color:white;text-decoration:none}
#vxClose{position:absolute;top:18px;right:15px;background:none;border:0;color:white;font-size:25px}
#vxDark{position:fixed;right:15px;bottom:20px;z-index:99999;width:52px;height:52px;border:0;border-radius:50%;font-size:23px;background:#111827;color:white}
body.vdark{background:#020617!important;color:#fff!important}
body.vdark header,body.vdark section,body.vdark .card,body.vdark .help,body.vdark .heroBox,body.vdark .ai{background:#0f172a!important;color:#fff!important}
</style>


<nav id="vxSide"><button id="vxClose">✕</button><a href="../index.html">⌂ Home</a><a href="../pages/emergency.html">🆘 Emergency</a><a href="../pages/hospital.html">🏥 Hospital</a><a href="../pages/government.html">🏛️ Government</a><a href="../pages/jobs.html">💼 Jobs</a><a href="../pages/education.html">📚 Education</a><a href="../pages/legal.html">⚖️ Legal</a><a href="../pages/business.html">🏪 Business</a><a href="../pages/nearby.html">📍 Nearby</a><a href="../pages/news.html">📰 News</a><a href="../pages/sports.html">🏆 Sports</a><a href="../pages/browser.html">🌐 Browser</a><a href="../pages/calculator.html">🧮 Calculator</a></nav>
<button id="vxDark">🌙</button>

<script>
const vm=document.getElementById("vxMenu");
const vs=document.getElementById("vxSide");
const vc=document.getElementById("vxClose");
const vd=document.getElementById("vxDark");

vm.onclick=()=>vs.classList.toggle("open");
vc.onclick=()=>vs.classList.remove("open");

if(localStorage.getItem("vxDark")==="1"){
 document.body.classList.add("vdark");
 vd.textContent="☀️";
}

vd.onclick=()=>{
 document.body.classList.toggle("vdark");
 const on=document.body.classList.contains("vdark");
 localStorage.setItem("vxDark",on?"1":"0");
 vd.textContent=on?"☀️":"🌙";
};
</script>
</body>
</html>
