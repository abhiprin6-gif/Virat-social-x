<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nearby Help - VIRAT SOCIAL X</title>
<link rel="stylesheet" href="../Css/style.css">
</head>
<body>
<header><div class="logo">V</div><div class="title"><h1>VIRAT SOCIAL <span class="s">X</span></h1><small>NEARBY HELP</small></div></header>
<main class="layout">
<section class="hero"><div class="heroBox"><h2>📍 Nearby Help</h2><p>अपने आसपास जरूरी services खोजें।</p></div></section>
<section class="grid">
<div class="help"><div class="helpIcon">🏥</div><h3>Hospitals</h3><button class="btn" onclick="search('hospital')">Find</button></div>
<div class="help"><div class="helpIcon">💊</div><h3>Pharmacy</h3><button class="btn" onclick="search('pharmacy')">Find</button></div>
<div class="help"><div class="helpIcon">🏧</div><h3>ATM</h3><button class="btn" onclick="search('ATM')">Find</button></div>
<div class="help"><div class="helpIcon">⛽</div><h3>Petrol Pump</h3><button class="btn" onclick="search('petrol pump')">Find</button></div>
</section>
</main>
<script>
function search(x){
location.href='https://www.google.com/maps/search/'+encodeURIComponent(x);
}
</script>
</body>
</html>
