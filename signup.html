<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Signup | VIRAT SOCIAL X</title>
<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,sans-serif;
background:#0f172a;
color:#fff;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
}
.box{
width:100%;
max-width:420px;
background:#1e293b;
padding:28px;
border-radius:25px;
box-shadow:0 10px 35px #0006;
}
.logo{
width:65px;height:65px;
border-radius:50%;
background:#2563eb;
display:flex;
align-items:center;
justify-content:center;
font-size:35px;
font-weight:bold;
margin:auto;
}
h1{text-align:center}
input{
width:100%;
padding:15px;
margin:7px 0;
border:0;
border-radius:14px;
font-size:16px;
}
button{
width:100%;
padding:15px;
border:0;
border-radius:14px;
background:#2563eb;
color:#fff;
font-size:16px;
font-weight:bold;
margin-top:10px;
}
a{
display:block;
text-align:center;
color:#93c5fd;
margin-top:18px;
text-decoration:none;
}
#msg{text-align:center;min-height:20px;margin-top:12px}
</style>
</head>
<body>

<div class="box">
<div class="logo">V</div>
<h1>Create Account</h1>

<form id="signupForm">
<input id="name" placeholder="Your name" required>
<input id="email" type="email" placeholder="Email" required>
<input id="password" type="password" minlength="6" placeholder="Password (6+ characters)" required>
<input id="confirm" type="password" minlength="6" placeholder="Confirm password" required>
<button type="submit">Create Account</button>
</form>

<div id="msg"></div>

<a href="login.html">Already have an account? Login</a>
<a href="index.html">Continue as Guest</a>
</div>

<script src="Js/auth.js"></script>
<script>
document.getElementById("signupForm").onsubmit=function(e){
e.preventDefault();

const name=document.getElementById("name").value;
const email=document.getElementById("email").value;
const password=document.getElementById("password").value;
const confirm=document.getElementById("confirm").value;
const msg=document.getElementById("msg");

if(password!==confirm){
msg.textContent="❌ Password match नहीं कर रहा";
return;
}

if(VXAuth.signup(name,email,password)){
msg.textContent="✅ Account created";
setTimeout(()=>location.href="profile.html",600);
}
};
</script>
</body>
</html>
